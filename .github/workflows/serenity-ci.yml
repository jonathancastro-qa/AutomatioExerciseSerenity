name: Serenity BDD CI

on:
  push:
    branches:
      - qa
  pull_request:
    branches:
      - qa
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Checkout del repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Configurar JDK 21
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # 3. Instalar Chrome y ChromeDriver con versiones garantizadas compatibles
      - name: Instalar Chrome y ChromeDriver
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable

      # 4. Instalar Xvfb
      - name: Instalar Xvfb
        run: sudo apt-get install -y xvfb

      # 5. Verificar instalacion de Chrome y ChromeDriver
      - name: Verificar instalacion de Chrome y ChromeDriver
        run: |
          echo "Chrome path: ${{ steps.setup-chrome.outputs.chrome-path }}"
          ${{ steps.setup-chrome.outputs.chrome-path }} --version
          echo "ChromeDriver path: ${{ steps.setup-chrome.outputs.chromedriver-path }}"
          ${{ steps.setup-chrome.outputs.chromedriver-path }} --version

      # 6. Ejecutar pruebas Serenity con Xvfb
      - name: Ejecutar pruebas Serenity
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' \
          mvn clean verify \
            -Dwebdriver.driver=chrome \
            -Dwebdriver.chrome.driver=${{ steps.setup-chrome.outputs.chromedriver-path }} \
            -Dwebdriver.chrome.binary=${{ steps.setup-chrome.outputs.chrome-path }} \
            -Dchrome.switches="--headless=new,--no-sandbox,--disable-dev-shm-usage,--disable-gpu,--window-size=1920,1080" \
            -Dserenity.outputDirectory=target/site/serenity \
            -e

      # 6.1. Imprimir errores de failsafe directamente en el log
      - name: Imprimir errores de failsafe
        if: failure()
        run: |
          echo "===== FAILSAFE REPORTS ====="
          find target/failsafe-reports -name "*.txt" 2>/dev/null | xargs -I {} sh -c 'echo "--- {} ---"; cat {}'
          echo "===== SUREFIRE REPORTS ====="
          find target/surefire-reports -name "*.txt" 2>/dev/null | xargs -I {} sh -c 'echo "--- {} ---"; cat {}'

      # 6.2. Guardar reportes de fallos Maven como artefacto
      - name: Guardar failsafe-reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: |
            target/failsafe-reports/
            target/surefire-reports/

      # 7. Regenerar reporte Serenity
      - name: Regenerar reporte Serenity
        if: success() || failure()
        run: mvn serenity:aggregate

      # 8. Verificar contenido del reporte
      - name: Verificar contenido del reporte
        if: success() || failure()
        run: ls -l target/site/serenity

      # 9. Guardar reporte como artefacto
      - name: Guardar reporte Serenity como artefacto
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-serenity
          path: target/site/serenity

      # 10. Publicar en GitHub Pages
      - name: Publicar reporte en GitHub Pages
        if: success() || failure()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/site/serenity