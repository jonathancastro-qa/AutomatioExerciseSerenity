name: Serenity BDD CI

on:
  push:
    branches:
      - qa
  pull_request:
    branches:
      - qa
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Checkout del repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Configurar JDK 21
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # 3. Instalar dependencias graficas necesarias
      - name: Instalar dependencias graficas
        run: |
          sudo apt-get update
          sudo apt-get install -y jq wget unzip xvfb \
            libnss3 libxss1 libasound2t64 fonts-liberation libatk-bridge2.0-0 libgtk-3-0

      # 4. Instalar Chrome for Testing y ChromeDriver compatible
      - name: Instalar Chrome for Testing con ChromeDriver
        run: |
          # Eliminar Chrome del sistema para evitar conflictos de version
          sudo apt-get remove -y google-chrome-stable || true
          sudo rm -f /usr/bin/google-chrome /usr/bin/chromium-browser

          # Instalar Chrome for Testing (version Stable)
          mkdir -p /opt/chrome
          curl -s https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json \
            | jq -r '.channels.Stable.downloads.chrome[] | select(.platform=="linux64") | .url' \
            | xargs wget -O chrome-linux.zip
          unzip chrome-linux.zip -d /opt/chrome
          sudo ln -s /opt/chrome/chrome-linux64/chrome /usr/bin/google-chrome

          # Instalar ChromeDriver de la misma version Stable
          curl -s https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json \
            | jq -r '.channels.Stable.downloads.chromedriver[] | select(.platform=="linux64") | .url' \
            | xargs wget -O chromedriver-linux.zip
          unzip chromedriver-linux.zip
          chmod +x chromedriver-linux64/chromedriver
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/chromedriver

      # 5. Verificar instalacion de Chrome y ChromeDriver
      - name: Verificar instalacion de Chrome y ChromeDriver
        run: |
          which google-chrome
          google-chrome --version
          which chromedriver
          chromedriver --version

      # 6. Ejecutar pruebas Serenity con Xvfb
      - name: Ejecutar pruebas Serenity
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1024x768x24' \
          mvn clean verify -Dwebdriver.driver=chrome \
            -Dwebdriver.chrome.driver=/usr/local/bin/chromedriver \
            -Dchrome.switches="--headless,--no-sandbox,--disable-dev-shm-usage,--disable-gpu,--remote-debugging-port=9222" \
            -Dserenity.outputDirectory=target/site/serenity \
            -e -X

      # 6.1. Imprimir errores de failsafe directamente en el log
      - name: Imprimir errores de failsafe
        if: failure()
        run: |
          echo "===== FAILSAFE REPORTS ====="
          find target/failsafe-reports -name "*.txt" | xargs -I {} sh -c 'echo "--- {} ---"; cat {}'
          echo "===== SUREFIRE REPORTS ====="
          find target/surefire-reports -name "*.txt" 2>/dev/null | xargs -I {} sh -c 'echo "--- {} ---"; cat {}'

      # 6.2. Guardar reportes de fallos Maven como artefacto
      - name: Guardar failsafe-reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: |
            target/failsafe-reports/
            target/surefire-reports/

      # 7. Regenerar reporte Serenity
      - name: Regenerar reporte Serenity
        if: success() || failure()
        run: mvn serenity:aggregate

      # 8. Verificar contenido del reporte
      - name: Verificar contenido del reporte
        if: success() || failure()
        run: ls -l target/site/serenity

      # 9. Guardar reporte como artefacto
      - name: Guardar reporte Serenity como artefacto
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-serenity
          path: target/site/serenity

      # 10. Publicar en GitHub Pages
      - name: Publicar reporte en GitHub Pages
        if: success() || failure()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/site/serenity